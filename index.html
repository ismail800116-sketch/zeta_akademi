<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeta Akademi LGS</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#0c2547;--mut:#5b6b84;--navy:#0b2c5f;--red:#e31b23;--ok:#12a150;--line:#dbe3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13233d;--ink:#eaf0fa;--mut:#9fb0cc;--navy:#6ea0ff;--line:#26385a}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#13233d;--ink:#eaf0fa;--mut:#9fb0cc;--navy:#6ea0ff;--line:#26385a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px}.top>div:nth-child(2){flex:1}
.lg{height:64px;border-radius:8px;background:#fff}
.av{width:52px;height:52px;border-radius:50%;background:var(--card);border:3px solid var(--red);display:grid;place-items:center;font-size:28px}
h1{font-size:22px;line-height:1.1;margin:0;color:var(--navy)}h2{font-size:18px;margin:20px 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px}
.chip{flex:none;border:2px solid var(--c);background:var(--card);border-radius:20px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--c);color:#fff;font-weight:700}
.nd{display:flex;align-items:center;gap:14px;margin:18px 0}
.dot{width:68px;height:68px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.dot:disabled{background:var(--line);color:var(--mut);cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mix{width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;margin-top:8px}
.mix:disabled{opacity:.45}.mix.navy{background:var(--navy)}:root[data-theme="dark"] .mix.navy{color:#0a1424}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--c,var(--red));transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.q{font-size:20px;font-weight:700;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.opt.ok{border-color:var(--ok);background:rgba(18,161,80,.15)}.opt.no{border-color:var(--red);background:rgba(227,27,35,.14)}
.score{font-size:60px;font-weight:800;color:var(--red);text-align:center;margin:14px 0 0}.c{text-align:center}
.ghost{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:12px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:var(--mut)}.nav .on{color:var(--red);font-weight:800}
input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.pick button{width:48px;height:48px;font-size:24px;border-radius:12px;border:2px solid var(--line);background:var(--card);margin:0 6px 6px 0}
.pick .on{border-color:var(--red)}.sw{width:40px!important;border:3px solid var(--line)!important}
.wq{font-size:14px;border-top:1px solid var(--line);padding:8px 0}
</style></head><body><main id="app"></main>
